# Reusable ESPHome package for Growatt ShineWiFi-X Modbus on ESP8266/esp07s.
# Import this from a device YAML via `packages:`.

substitutions:
  modbus_address: "0x01"
  update_interval: 5s

uart:
  id: inverter_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: growatt_modbus
  uart_id: inverter_uart
  send_wait_time: 200ms

modbus_controller:
  - id: growatt
    address: ${modbus_address}
    modbus_id: growatt_modbus
    command_throttle: 100ms
    setup_priority: -10
    update_interval: ${update_interval}

binary_sensor:
  - platform: status
    name: Status

sensor:
  # Growatt protocol v1.24 input registers, taken from the upstream
  # OpenInverterGateway Growatt124 definition. 32-bit values are high-word first.
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: Inverter Status
    id: inverter_status
    register_type: read
    address: 0
    value_type: U_WORD
    icon: mdi:state-machine

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: Input Power
    id: input_power
    register_type: read
    address: 1
    value_type: U_DWORD
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: PV1 Voltage
    id: pv1_voltage
    register_type: read
    address: 3
    value_type: U_WORD
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
