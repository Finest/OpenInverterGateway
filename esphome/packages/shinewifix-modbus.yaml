# Reusable ESPHome package for Growatt ShineWiFi-X Modbus on ESP8266/esp07s.
# Import this from a device YAML via `packages:`.

substitutions:
  modbus_address: "0x01"
  update_interval: 30s

esphome:
  on_boot:
    # Register before ESPHome's generic web_server handler (priority WIFI - 1 = 249)
    # so the normal root page can include the Modbus compatibility form inline.
    priority: 249.5
    then:
      - lambda: |-
          using esphome::modbus::ModbusRegisterType;
          using esphome::modbus_controller::ModbusCommandItem;
          using esphome::web_server_base::global_web_server_base;

          auto *ctrl = id(growatt);
          auto *result = id(modbus_rw_last_result);

          if (global_web_server_base == nullptr) {
            if (result != nullptr)
              result->publish_state("Modbus WebGUI route registration failed: web server base not ready");
            return;
          }

          ctrl->set_allow_duplicate_commands(true);

          auto publish_result = [result](const char *msg) {
            if (result != nullptr)
              result->publish_state(msg);
          };

          auto parse_u16 = [](const String &value, uint16_t *out) -> bool {
            if (value.length() == 0)
              return false;
            char *end = nullptr;
            unsigned long parsed = strtoul(value.c_str(), &end, 0);
            if (end == value.c_str() || *end != '\0' || parsed > 0xFFFFUL)
              return false;
            *out = static_cast<uint16_t>(parsed);
            return true;
          };

          auto add_route = [](const char *uri, WebRequestMethodComposite method,
                              ArRequestHandlerFunction on_request) {
            auto *handler = new AsyncCallbackWebHandler();
            handler->setUri(uri);
            handler->setMethod(method);
            handler->onRequest(on_request);
            global_web_server_base->add_handler(handler);
          };

          static const char *index_html = R"=====(<!DOCTYPE html><html><head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="icon" href="data:">
          <style>
            body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#111;color:#eee}
            .oig-box{box-sizing:border-box;margin:12px;padding:16px;border-radius:12px;background:#1f1f1f;border:1px solid #333;max-width:760px}
            .oig-box h2{margin:0 0 12px;font-size:1.25rem}
            .oig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
            .oig-box input,.oig-box select,.oig-box button{box-sizing:border-box;width:100%;padding:10px;border-radius:8px;border:1px solid #555;background:#2a2a2a;color:#fff}
            .oig-box button{cursor:pointer;background:#1565c0;border-color:#1976d2;font-weight:bold}
            .oig-box small{color:#bbb}.oig-result{margin-top:10px;white-space:pre-wrap;color:#ddd}
          </style>
          </head><body>
          <esp-app></esp-app>
          <section class="oig-box">
            <h2>Growatt Post Communication Modbus</h2>
            <form id="oig-modbus-form" action="/postCommunicationModbus_p" method="POST">
              <div class="oig-grid">
                <input type="text" name="reg" placeholder="Register ID" required>
                <input type="text" name="val" placeholder="Input Value (16bit only!)" value="0" required>
                <select name="type"><option value="16b" selected>16b</option><option value="32b">32b</option></select>
                <select name="operation"><option value="R" selected>Read</option><option value="W">Write</option></select>
                <select name="registerType"><option value="I" selected>Input Register</option><option value="H">Holding Register</option></select>
                <button type="submit">go</button>
              </div>
            </form>
            <small>ESPHome queues Modbus commands asynchronously. The final answer is also published to <b>Modbus Last Result</b>.</small>
            <div id="oig-modbus-result" class="oig-result"></div>
          </section>
          <script>
            const f=document.getElementById('oig-modbus-form'),r=document.getElementById('oig-modbus-result');
            f.addEventListener('submit',async e=>{e.preventDefault();r.textContent='Sending...';try{const res=await fetch(f.action,{method:'POST',body:new FormData(f)});r.textContent=await res.text();}catch(err){r.textContent='Request failed: '+err;}});
          </script>
          <script src="https:&#47;&#47;oi.esphome.io/v2/www.js"></script>
          </body></html>)=====";

          add_route("/", HTTP_GET, [index_html](AsyncWebServerRequest *request) {
            request->send(200, "text/html", index_html);
          });

          add_route("/postCommunicationModbus_p", HTTP_POST,
                    [ctrl, result, publish_result, parse_u16](AsyncWebServerRequest *request) {
                       if (!request->hasParam("reg", true) || !request->hasParam("val", true)) {
                         request->send(400, "text/plain", "400: Invalid Request");
                         return;
                       }

                       const String reg_arg = request->getParam("reg", true)->value();
                       const String val_arg = request->getParam("val", true)->value();
                       const String operation = request->hasParam("operation", true)
                                                    ? request->getParam("operation", true)->value()
                                                    : String("R");
                       const String type = request->hasParam("type", true)
                                               ? request->getParam("type", true)->value()
                                               : String("16b");
                       const String register_type_arg = request->hasParam("registerType", true)
                                                            ? request->getParam("registerType", true)->value()
                                                            : String("I");

                       uint16_t reg = 0;
                       uint16_t val = 0;
                       if (!parse_u16(reg_arg, &reg) || !parse_u16(val_arg, &val)) {
                         request->send(400, "text/plain", "400: Invalid Request");
                         return;
                       }

                       const bool is_read = operation == "R";
                       const bool is_holding = register_type_arg == "H";
                       const bool is_32bit = type == "32b";

                       if (is_read) {
                         const uint16_t count = is_32bit ? 2 : 1;
                         const auto register_type = is_holding ? ModbusRegisterType::HOLDING : ModbusRegisterType::READ;

                         char queued[128];
                         snprintf(queued, sizeof(queued), "Queued read %u-bit %s register %u",
                                  is_32bit ? 32 : 16, is_holding ? "holding" : "input", reg);
                         publish_result(queued);

                         ctrl->queue_command(ModbusCommandItem::create_read_command(
                             ctrl, register_type, reg, count,
                             [result, reg, count, is_holding](ModbusRegisterType register_type,
                                                              uint16_t start_address,
                                                              const std::vector<uint8_t> &data) {
                               char msg[192];
                               if (data.size() < count * 2) {
                                 snprintf(msg, sizeof(msg),
                                          "Read %u-bit %s register %u impossible - not connected?",
                                          count == 2 ? 32 : 16, is_holding ? "holding" : "input", reg);
                                 if (result != nullptr)
                                   result->publish_state(msg);
                                 return;
                               }

                               uint32_t value = (static_cast<uint32_t>(data[0]) << 8) | data[1];
                               if (count == 2) {
                                 value = (static_cast<uint32_t>(data[0]) << 24) |
                                         (static_cast<uint32_t>(data[1]) << 16) |
                                         (static_cast<uint32_t>(data[2]) << 8) | data[3];
                               }

                               snprintf(msg, sizeof(msg), "Read %u-bit %s register %u with value %lu",
                                        count == 2 ? 32 : 16, is_holding ? "holding" : "input", reg,
                                        static_cast<unsigned long>(value));
                               if (result != nullptr)
                                 result->publish_state(msg);
                             }));

                         request->send(200, "text/plain", queued);
                         return;
                       }

                       if (!is_holding) {
                         const char *msg = "It is not possible to write into input registers";
                         publish_result(msg);
                         request->send(200, "text/plain", msg);
                         return;
                       }

                       if (is_32bit) {
                         const char *msg = "Writing to double (32b) registers not supported";
                         publish_result(msg);
                         request->send(200, "text/plain", msg);
                         return;
                       }

                       char queued[128];
                       snprintf(queued, sizeof(queued), "Queued write holding register %u to a value of %u", reg, val);
                       publish_result(queued);

                       auto cmd = ModbusCommandItem::create_write_single_command(ctrl, reg, val);
                       cmd.on_data_func = [result, reg, val](ModbusRegisterType register_type,
                                                             uint16_t start_address,
                                                             const std::vector<uint8_t> &data) {
                         char msg[192];
                         if (data.size() >= 4) {
                           const uint16_t ack_reg = (static_cast<uint16_t>(data[0]) << 8) | data[1];
                           const uint16_t ack_val = (static_cast<uint16_t>(data[2]) << 8) | data[3];
                           snprintf(msg, sizeof(msg),
                                    "Wrote holding register %u to a value of %u! (ack register %u = %u)",
                                    reg, val, ack_reg, ack_val);
                         } else {
                           snprintf(msg, sizeof(msg), "Wrote holding register %u to a value of %u!", reg, val);
                         }
                         if (result != nullptr)
                           result->publish_state(msg);
                       };
                       ctrl->queue_command(cmd);

                       request->send(200, "text/plain", queued);
                     });

          publish_result("Modbus WebGUI section available on ESPHome root page");

uart:
  id: inverter_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: growatt_modbus
  uart_id: inverter_uart
  send_wait_time: 500ms

modbus_controller:
  - id: growatt
    address: ${modbus_address}
    modbus_id: growatt_modbus
    command_throttle: 250ms
    setup_priority: -10
    update_interval: ${update_interval}

sensor:
  # Growatt protocol v1.24 input registers, taken from the upstream
  # OpenInverterGateway Growatt124 definition. 32-bit values are high-word first.
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: Inverter Status
    id: inverter_status
    register_type: read
    address: 0
    value_type: U_WORD
    icon: mdi:state-machine

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: Input Power
    id: input_power
    register_type: read
    address: 1
    value_type: U_DWORD
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: PV1 Voltage
