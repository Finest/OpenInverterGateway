substitutions:
  device_name: openinvertergateway
  friendly_name: OpenInverterGateway
  wifi_ssid: CHANGE_ME
  wifi_password: CHANGE_ME
  # Growatt ShineWiFi-X talks Modbus RTU as master at 115200 baud, slave id 1.
  modbus_address: "0x01"
  update_interval: 30s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "ESPHome port of OpenInverterGateway for Growatt ShineWiFi-X"
  project:
    name: finest.openinvertergateway
    version: "0.1.0"

esp8266:
  board: esp07s
  restore_from_flash: true

# The ShineWiFi-X uses the ESP8266 hardware UART for inverter communication.
# Keep serial logging disabled or it will corrupt Modbus traffic.
logger:
  baud_rate: 0
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  min_auth_mode: WPA2
  ap:
    ssid: "${friendly_name} Fallback"
    password: "openinverter"

captive_portal:

web_server:
  port: 80

status_led:
  pin:
    number: GPIO2
    inverted: true

uart:
  id: inverter_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: growatt_modbus
  uart_id: inverter_uart
  send_wait_time: 500ms

modbus_controller:
  - id: growatt
    address: ${modbus_address}
    modbus_id: growatt_modbus
    command_throttle: 250ms
    setup_priority: -10
    update_interval: ${update_interval}

binary_sensor:
  - platform: status
    name: Status

sensor:
  # Growatt protocol v1.24 input registers, taken from the upstream
  # OpenInverterGateway Growatt124 definition. 32-bit values are high-word first.
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: Inverter Status
    id: inverter_status
    register_type: read
    address: 0
    value_type: U_WORD
    icon: mdi:state-machine

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: Input Power
    id: input_power
    register_type: read
    address: 1
    value_type: U_DWORD
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: PV1 Voltage
    id: pv1_voltage
